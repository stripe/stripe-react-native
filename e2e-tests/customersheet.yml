appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: "Accept a payment"
- scrollUntilVisible:
    element:
      text: "Customer Sheet"
    direction: DOWN
- tapOn: "Customer Sheet"
- tapOn: "Edit payment methods"
- extendedWaitUntil:
    visible: "TEST"
    timeout: 150000
- tapOn:
    text: "Card number. Supported cards include.*"
- inputText: "4242424242424242"
- tapOn:
    text: "MM / YY"
    optional: true
- inputText: "0145"
- tapOn:
    text: "CVC"
- inputText: "123"
- tapOn:
    text: "Done"
    optional: true
- tapOn: "Save"
- extendedWaitUntil:
    visible: .*4242
    timeout: 30000
- tapOn: .*4242
- runFlow:
    when:
      visible: "Confirm"
    commands:
      - tapOn: "Confirm"
- extendedWaitUntil:
    visible:
      id: "customer-sheet-selected-payment-option"
    timeout: 30000
- tapOn:
    id: "customer-sheet-selected-payment-option"
- tapOn: "Close"
- assertVisible:
    text: "Canceled"
- tapOn: "OK"
- tapOn:
    id: "customer_adapter_switch"
- tapOn:
    id: "customer-sheet-selected-payment-option"
- extendedWaitUntil:
    visible: "TEST"
    timeout: 150000
