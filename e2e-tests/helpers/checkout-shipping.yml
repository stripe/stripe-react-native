appId: ${APP_ID}
---
# Callers select the US test address so saving does not depend on autocomplete.
- scrollUntilVisible:
    element:
      text: '(?s)(Add|Edit) shipping address.*'
    centerElement: true
- tapOn: '(?s)(Add|Edit) shipping address.*'
- extendedWaitUntil:
    visible: '(?i)Shipping address'
    timeout: 30000
- assertVisible: 'Full name'
- assertVisible: 'Jenny Rosen'
- assertVisible: '510 Townsend St'
- scrollUntilVisible:
    element:
      text: 'Save address'
    centerElement: true
- tapOn: 'Save address'
- extendedWaitUntil:
    notVisible: 'Save address'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '(?s)Edit shipping address, Jenny Rosen.*510 Townsend St.*'
    centerElement: true
    timeout: 30000
