appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      text: 'Select payment method'
    centerElement: true
- tapOn: 'Select payment method'
- extendedWaitUntil:
    visible: 'Card'
    timeout: 60000
- tapOn: 'Card'
- tapOn: 'Card number. Supported cards include.*'
- inputText: ${CARD_NUMBER}
- inputText: '0145'
- inputText: '123'
- tapOn: 'ZIP.*'
- inputText: '94107'
- scrollUntilVisible:
    element:
      text: 'Continue'
- tapOn: 'Continue'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Close'
    timeout: 60000
- tapOn: 'Close'
- extendedWaitUntil:
    visible: 'Your Cart'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Buy.*'
    centerElement: true
