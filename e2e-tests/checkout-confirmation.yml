appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: 'Accept a payment'
- scrollUntilVisible:
    element:
      text: 'Checkout Sessions.*'
- tapOn: 'Checkout Sessions.*'
- extendedWaitUntil:
    visible: 'Create session'
    timeout: 60000
- tapOn: 'Create session'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 150000
- scrollUntilVisible:
    element:
      text: 'Confirm'
    centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Confirm'
      - scrollUntilVisible:
          element:
            text: 'Confirm: .*"status":"failed".*'
          direction: UP
          centerElement: true
          timeout: 30000
      - assertVisible: 'Status: ready'
- runFlow:
    file: helpers/checkout-card.yml
    env:
      CARD_NUMBER: '4242424242424242'
- tapOn: 'Confirm'
- scrollUntilVisible:
    element:
      text: 'Confirm: .*"status":"completed".*'
    direction: UP
    centerElement: true
    timeout: 150000
- assertVisible: 'Confirm: .*"paymentStatus":"paid".*'
- assertVisible: 'Status: ready'
- scrollUntilVisible:
    element:
      text: 'Reload'
    direction: DOWN
    centerElement: true
- tapOn: 'Reload'
- extendedWaitUntil:
    visible: 'Reload: done'
    timeout: 150000
- runFlow:
    file: helpers/checkout-card.yml
    env:
      CARD_NUMBER: '4000000000000002'
- tapOn: 'Confirm'
- scrollUntilVisible:
    element:
      text: 'Confirm: .*"status":"failed".*'
    direction: UP
    centerElement: true
    timeout: 90000
- scrollUntilVisible:
    element:
      text: 'Status: ready'
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element:
      text: 'Reload'
    direction: DOWN
    centerElement: true
- tapOn: 'Reload'
- extendedWaitUntil:
    visible: 'Reload: done'
    timeout: 150000
- runFlow:
    file: helpers/checkout-card.yml
    env:
      CARD_NUMBER: '4000000000003220'
- tapOn: 'Confirm'
- extendedWaitUntil:
    notVisible: 'Confirm'
    timeout: 90000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      # Safari's remote authentication view does not expose its close button to Maestro.
      - tapOn:
          point: '10%,9%'
- scrollUntilVisible:
    element:
      text: 'Confirm: .*"status":"canceled".*'
    direction: UP
    centerElement: true
    timeout: 90000
- scrollUntilVisible:
    element:
      text: 'Status: ready'
    direction: UP
    centerElement: true
