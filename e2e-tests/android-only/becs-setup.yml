appId: ${APP_ID}
---
# TODO: Re-enable on iOS once we can enter 000-000 as the test bank.
# Currently, 000-000 isn't recognized since the app is built in release mode.
- launchApp:
    clearState: true
- tapOn: "Bank Debits"
- tapOn: "BECS Direct Debit set up"
- tapOn:
    text: "Name"
    optional: true
- inputText: "stripe"
- tapOn:
    text: "Email Address"
    optional: true
- inputText: "test@stripe.com"
- tapOn:
    text: "BSB"
- inputText: "000000"
- tapOn:
    text: "Account number"
- inputText: "000123456"
# The account field keeps the numeric keyboard up. That window covers the
# center of Save, but Maestro still treats the button's layout bounds as
# fully visible, so the tap lands on the keyboard and the form never submits.
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
- tapOn:
    text: "Save"
    retryTapIfNoChange: false
- assertVisible:
    text: "Success"
- tapOn: "OK"
