appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: 'Accept a payment'
- scrollUntilVisible:
    element:
      text: 'Checkout Sessions.*'
- tapOn: 'Checkout Sessions.*'
- extendedWaitUntil:
    visible: 'Create Checkout Session'
    timeout: 60000
- tapOn: 'Reset'
- scrollUntilVisible:
    element:
      text: 'Automatic Payment Methods'
    centerElement: true
- tapOn: 'Automatic Payment Methods'
- scrollUntilVisible:
    element:
      text: 'Enable Express Checkout'
# Move the final toggle above the fixed Create Checkout Session footer.
- swipe:
    direction: UP
- tapOn: 'Enable Express Checkout'
- assertVisible:
    text: 'Enable Express Checkout'
    checked: true
- tapOn:
    id: 'checkout-create-session'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 150000
- assertVisible:
    id: 'checkout-express-checkout'

# Check native content, not just the React Native container.
- assertVisible: 'Pay with GPay'
- tapOn: 'Pay with GPay'
- extendedWaitUntil:
    notVisible: 'Pay with GPay'
    timeout: 30000
- pressKey: BACK
- extendedWaitUntil:
    visible: 'Canceled'
    timeout: 60000
- assertVisible: 'The payment was canceled.'
- tapOn: 'OK'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 30000
- assertVisible: 'Pay with GPay'
