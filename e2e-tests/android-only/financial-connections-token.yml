appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: "Financial Connections"
- tapOn: "Collect Bank Account"
- assertVisible:
    text: "Collect token"
- tapOn:
    text: "Collect token"
    retryTapIfNoChange: false
- tapOn:
    # Accept Link terms
    text: "Agree and continue"
- assertVisible:
    text: "Test (Non-OAuth)"
- tapOn:
    text: "Test (Non-OAuth)"

# Chrome 109 (API 33): Accept & continue, Use without an account, No thanks.
# Chrome 149 (API 37.1): Stay signed out. Each dismissal is its own optional
# runFlow so a missing control does not skip the others.
- runFlow:
    optional: true
    commands:
      - extendedWaitUntil:
          visible: "Stay signed out"
          timeout: 10000
      - tapOn:
          text: "Stay signed out"
- runFlow:
    optional: true
    commands:
      - extendedWaitUntil:
          visible: "Accept & continue"
          timeout: 10000
      - tapOn:
          text: "Accept & continue"
- runFlow:
    optional: true
    commands:
      - extendedWaitUntil:
          visible: "Use without an account"
          timeout: 10000
      - tapOn:
          text: "Use without an account"
- runFlow:
    optional: true
    commands:
      - extendedWaitUntil:
          visible: "No thanks"
          timeout: 10000
      - tapOn:
          text: "No thanks"

- extendedWaitUntil:
    visible: "Connect account"
    timeout: 30000
- tapOn:
    text: "Connect account"

- assertVisible:
    text: "Finish without saving"
- tapOn:
    text: "Finish without saving"

- assertVisible:
    text: "Back to Stripe Shop"
    optional: true
- tapOn:
    text: "Back to Stripe Shop"
    optional: true
- assertVisible:
    text: "Done"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- assertVisible:
    text: "Back to Test Inc."
    optional: true
- tapOn:
    text: "Back to Test Inc."
    optional: true

- assertVisible:
    text: "Success"
- tapOn:
    text: "OK"
    optional: true
