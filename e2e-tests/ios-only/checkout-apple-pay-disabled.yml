appId: ${APP_ID}
---
# Turning Apple Pay off removes it from both the Payment Element and the Express Checkout Element.
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: 'Accept a payment'
- scrollUntilVisible:
    element:
      text: 'Checkout Sessions.*'
- tapOn: 'Checkout Sessions.*'
- extendedWaitUntil:
    visible: 'Create Checkout Session'
    timeout: 60000
- tapOn: 'Reset'
- scrollUntilVisible:
    element:
      id: 'checkout-apple-pay-toggle'
    centerElement: true
- tapOn:
    id: 'checkout-apple-pay-toggle'
- scrollUntilVisible:
    element:
      text: 'Enable Express Checkout'
# Move the final toggle above the fixed Create Checkout Session footer.
- swipe:
    direction: UP
- tapOn: 'Enable Express Checkout'
- tapOn:
    id: 'checkout-create-session'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 150000
# With Apple Pay off there may be no wallet left to show, so the Express element can
# collapse to nothing. Only assert that Apple Pay is absent.
- assertNotVisible:
    text: '.*Apple.?Pay.*'
    above:
      text: 'Items'
- scrollUntilVisible:
    element:
      id: 'checkout-select-payment-method'
    centerElement: true
# Nothing is preselected: the Payment Element does not offer Apple Pay.
- assertVisible:
    id: 'checkout-select-payment-method'
    text: 'Select payment method'
- assertNotVisible:
    id: 'checkout-select-payment-method'
    text: '.*Apple Pay.*'
