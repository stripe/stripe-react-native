appId: ${APP_ID}
---
# Apple Pay is offered by both the Payment Element and the Express Checkout Element.
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: 'Accept a payment'
- scrollUntilVisible:
    element:
      text: 'Checkout Sessions.*'
- tapOn: 'Checkout Sessions.*'
- extendedWaitUntil:
    visible: 'Create Checkout Session'
    timeout: 60000
- tapOn: 'Reset'
- scrollUntilVisible:
    element:
      text: 'Enable Express Checkout'
# Move the final toggle above the fixed Create Checkout Session footer.
- swipe:
    direction: UP
- tapOn: 'Enable Express Checkout'
- tapOn:
    id: 'checkout-create-session'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 150000
- assertVisible:
    id: 'checkout-express-checkout'
# The Express button sits above Items; the Payment Element's row is below.
- assertVisible:
    text: '.*Apple.?Pay.*'
    above:
      text: 'Items'
- scrollUntilVisible:
    element:
      id: 'checkout-select-payment-method'
    centerElement: true
# Apple Pay is preselected as the payment option.
- assertVisible:
    id: 'checkout-select-payment-method'
    text: '.*Apple Pay.*'
