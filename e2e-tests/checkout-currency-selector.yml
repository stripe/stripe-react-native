appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: 'Accept a payment'
- scrollUntilVisible:
    element:
      text: 'Checkout Sessions.*'
- tapOn: 'Checkout Sessions.*'
- extendedWaitUntil:
    visible: 'Create session'
    timeout: 60000
- tapOn: 'Use Adaptive Pricing'
- tapOn: 'Create session'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 150000
- scrollUntilVisible:
    element:
      id: 'checkout-currency-selector'
    timeout: 30000
- assertVisible:
    id: 'checkout-currency-selector'
- tapOn:
    text: '.*\$.*'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: 'Show session'
- tapOn: 'Show session'
- scrollUntilVisible:
    element:
      text: '.*"currency": "usd".*'
    timeout: 30000
