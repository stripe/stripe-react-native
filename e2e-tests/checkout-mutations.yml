appId: ${APP_ID}
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn: 'Accept a payment'
- scrollUntilVisible:
    element:
      text: 'Checkout Sessions.*'
- tapOn: 'Checkout Sessions.*'
- extendedWaitUntil:
    visible: 'Create Checkout Session'
    timeout: 60000
- tapOn: 'Reset'
- tapOn: 'PaymentElement'
- tapOn: 'view'
- tapOn: 'Email source'
- tapOn: 'Local'
- scrollUntilVisible:
    element:
      text: 'Default Shipping Address'
    centerElement: true
- tapOn: 'Default Shipping Address'
- tapOn: 'US test address'
- tapOn:
    id: 'checkout-create-session'
- extendedWaitUntil:
    visible: 'Status: ready'
    timeout: 150000
- scrollUntilVisible:
    element:
      text: 'Edit email'
    centerElement: true
- tapOn: 'Edit email'
- tapOn:
    id: 'checkout-email-input'
- eraseText
- inputText: 'updated@example.com'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: 'Save email'
- extendedWaitUntil:
    notVisible: 'Save email'
    timeout: 30000
- extendedWaitUntil:
    visible: 'updated@example.com'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Status: ready'
    direction: UP
    centerElement: true
    timeout: 30000
- runFlow:
    file: helpers/checkout-shipping.yml
- scrollUntilVisible:
    element:
      text: 'Clear address'
    direction: UP
    centerElement: true
- tapOn: 'Clear address'
- extendedWaitUntil:
    visible: 'Add shipping address'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Select payment method'
    centerElement: true
- tapOn: 'Select payment method'
- scrollUntilVisible:
    element:
      text: 'Card'
- tapOn: 'Card'
- tapOn: 'Card number. Supported cards include.*'
- inputText: '4242424242424242'
- inputText: '0145'
- inputText: '123'
- tapOn: 'ZIP.*'
- inputText: '94107'
- scrollUntilVisible:
    element:
      text: 'Continue'
- tapOn: 'Continue'
- extendedWaitUntil:
    notVisible: 'Continue'
    timeout: 60000
- scrollUntilVisible:
    element:
      text: 'Done'
- tapOn: 'Done'
- extendedWaitUntil:
    visible: 'Clear payment option'
    timeout: 30000
- tapOn: 'Clear payment option'
- extendedWaitUntil:
    visible: 'Select payment method'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: 'Status: ready'
    direction: UP
    centerElement: true
    timeout: 30000
