appId: com.stripe.react.native.testharness
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: 'harness: (flushed|flush-failed)'
    timeout: 120000
- assertVisible: 'harness: flushed'
- assertVisible: 'initStripe:'
- assertVisible: 'isPlatformPaySupported:'
- assertVisible: 'handleURLCallback:'
- assertVisible: 'createPaymentMethod (incomplete card):'
- assertVisible: 'createToken (incomplete card):'
- assertVisible: 'initPaymentSheet (unknown intent):'
