org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true

# The run script passes the attached device's ABI with -PreactNativeArchitectures.
reactNativeArchitectures=arm64-v8a,x86_64

# stripe-react-native and react-native-coverage require the new architecture.
newArchEnabled=true
bridgelessEnabled=true

# Keep in step with example/android/gradle.properties and the library's
# StripeSdk_kotlinVersion in android/gradle.properties.
KOTLIN_VERSION=2.2.21
