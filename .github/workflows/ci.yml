name: CI
# GitHub Actions port of main-trigger-pipeline in bitrise.yml. Job names match
# the Bitrise workflows they replace. Shared setup lives in .github/actions.
# ci-gate depends on every job and is the single check for branch protection.
on:
  pull_request:
  push:
    branches: [master, ga]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '33'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
  # Pin Maestro CLI installs (stripe-android style); installer fetches
  # github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip
  MAESTRO_VERSION: '2.12.1'
  RETRY_MAX_ATTEMPTS: '5'
  RETRY_SLEEP_FAST: '10'
  RETRY_SLEEP_SLOW: '45'
  # Set by Bitrise's macOS stacks; keeps CocoaPods and Xcode output plain.
  CI: 'true'

jobs:
  js-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Run TypeScript Checks
        run: yarn typescript
      - name: Run ESLint
        if: ${{ !cancelled() }}
        run: yarn lint
      - name: Run Jest Tests
        if: ${{ !cancelled() }}
        run: yarn test
      - name: Validate Package Types
        if: ${{ !cancelled() }}
        run: yarn test:package-types
      - name: Run Example TypeScript Checks
        if: ${{ !cancelled() }}
        run: cd example && yarn typescript

  unit-test-ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bitrise's xcode-test step created the iPhone 16 Pro Max on the newest
      # installed runtime, not the iOS 18.6 one the e2e tests use.
      - uses: ./.github/actions/setup-ios-simulator
        id: simulator
        with:
          runtime: '26.5'
      - uses: ./.github/actions/setup-js
      - name: Check iOS Code Formatting
        run: |
          brew install swiftlint
          yarn format:ios:check
      - name: Install Pods
        run: yarn pods
      # The SDK's native unit tests are compiled into the test app's
      # ReactTestAppTests target by example/ios/Podfile (post_integrate); the
      # podspec deliberately ships no test spec, because one isn't usable under
      # SPM resolution.
      - name: Xcode Test for iOS
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/xcode"
          xcodebuild test \
            -workspace example/ios/example.xcworkspace \
            -scheme ReactTestApp \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:ReactTestAppTests \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath "$RUNNER_TEMP/xcode/unit-test-ios.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/xcode/xcodebuild_test.log" | xcbeautify --renderer github-actions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: unit-test-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcode
          if-no-files-found: ignore
          retention-days: 7

  unit-test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check Android Code Formatting
        run: yarn format:android:check
      - name: Check Android Lint
        run: yarn lint:android
      # Transient Maven/CDN failures (Connection refused) are common for
      # android-all-instrumented; fetch into mavenLocal with retries before the
      # unit tests so Robolectric does not download mid-suite.
      - name: Pre-download Robolectric SDKs
        run: |
          set -euo pipefail
          source scripts/ci/retry.sh
          cd example/android
          retry --attempts "$RETRY_MAX_ATTEMPTS" --sleep "$RETRY_SLEEP_SLOW" --backoff 2 -- \
            ./gradlew :stripe_stripe-react-native:robolectricSdkDownload --no-daemon
      - name: Run Android Unit Tests
        working-directory: example/android
        run: ./gradlew :stripe_stripe-react-native:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: unit-test-android-${{ github.run_attempt }}
          path: android/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  e2e-build-ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ios-simulator
        with:
          # Building for the simulator SDK doesn't need a device.
          runtime: ''
      - uses: ./.github/actions/setup-js
      - name: Build App JS Bundle
        run: yarn example build:ios
      - name: Install Pods
        run: yarn pods
      - name: Build iOS App (Release, Simulator)
        run: |
          set -euo pipefail

          cd example/ios
          DERIVED_DATA_PATH="$GITHUB_WORKSPACE/DerivedData"
          # ARCHS/ONLY_ACTIVE_ARCH: build only the arm64 simulator slice (CI
          # runners and the SPM-built Stripe package don't need Intel).
          build_ios() {
            xcodebuild -workspace example.xcworkspace \
              -scheme example \
              -configuration Release \
              -sdk iphonesimulator \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=YES \
              build 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild_build.log" | xcbeautify --renderer github-actions
          }
          build_ios || (echo "iOS build failed, retrying in 30s..." && sleep 30 && build_ios)

          APP_ROOT="$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator"
          ( cd "$APP_ROOT" && zip -qr "$GITHUB_WORKSPACE/app-release.app.zip" ReactTestApp.app )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-app
          path: app-release.app.zip
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-build-ios-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xcodebuild_build.log
          if-no-files-found: ignore
          retention-days: 7

  e2e-tests-ios:
    name: e2e-tests-ios (${{ matrix.shard }})
    needs: e2e-build-ios
    # Flows ran 4-5x slower than on Bitrise on the 3-vCPU macos-26 runner,
    # which made taps land before the app was ready and couldn't fit the job
    # timeout.
    runs-on: macos-26-xlarge
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ios-simulator
        with:
          boot: 'true'
      - uses: ./.github/actions/setup-js
        with:
          install: 'false'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-app
      - name: Unzip .app and Install to Simulator
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-artifact"
          mkdir -p "$OUT"
          unzip -q app-release.app.zip -d "$OUT"
          IOS_APP="$(find "$OUT" -maxdepth 2 -type d -name "*.app" | head -n 1)"
          xcrun simctl install booted "$IOS_APP"
      - name: Install Maestro CLI
        run: ./scripts/ci/install-maestro.sh
      - name: Run iOS E2E Tests (Maestro)
        run: |
          export MAESTRO_BIN="${HOME}/.maestro/bin/maestro"
          yarn test:e2e:ios --record-on-failure
      # always(): a job that hits timeout-minutes ends as cancelled.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-artifacts-ios-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts
            ~/.maestro/tests
            ~/Library/Logs/maestro
          if-no-files-found: ignore
          retention-days: 7

  # Validates the Expo Continuous Native Generation path on every PR: a fresh
  # `expo prebuild --clean` project gets exactly ONE `pod install`, so every SPM
  # artifact (package reference, embed phase) must land in that single pass.
  # The other iOS jobs all build the committed react-native-test-app project.
  # bitrise.yml's CocoaPods fallback step is disabled (run_if: 'false'), so it
  # isn't ported.
  expo-prebuild-ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPO_SDK_VERSION: '54'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ios-simulator
        with:
          runtime: ''
      - uses: ./.github/actions/setup-js
      - name: Expo prebuild + build (SPM mode)
        run: ./scripts/test-expo-project --sdk-version "$EXPO_SDK_VERSION" --platforms ios

  e2e-build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build Android App
        working-directory: example/android
        run: |
          yarn build:android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --build-cache --no-scan || \
            (echo "Gradle build failed, retrying in 30s..." && sleep 30 && \
             ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --build-cache --no-scan)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: example/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

  e2e-tests-android:
    name: e2e-tests-android (${{ matrix.shard }})
    needs: e2e-build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
        with:
          install: 'false'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
      - name: Install Maestro CLI
        run: ./scripts/ci/install-maestro.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run E2E Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MAESTRO_BIN: /home/runner/.maestro/bin/maestro
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: >-
            -camera-back none -camera-front none -netdelay none -netspeed full
            -memory 8192 -no-snapshot -no-audio -no-window
            -gpu swiftshader_indirect -no-boot-anim
          script: adb install -r app-release.apk && yarn test:e2e:android --record-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-artifacts-android-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts
            ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 7

  # Single check for branch protection.
  ci-gate:
    if: always()
    needs:
      - js-tests
      - unit-test-ios
      - unit-test-android
      - e2e-build-ios
      - e2e-tests-ios
      - expo-prebuild-ios
      - e2e-build-android
      - e2e-tests-android
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
